  <linearGradient id="prism" x2=".8" y2="1"><stop stop-color="#a4edff" stop-opacity=".28"/><stop offset="1" stop-color="#b8a2ff" stop-opacity=".05"/></linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#93a7cd" stroke-opacity=".045"/></pattern>
</defs>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Prismestra</title>
<desc id="desc">One local lighting scene connects a PC, a Bluetooth strip, an LCD and home lights.</desc>
